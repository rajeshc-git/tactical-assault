<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="50%" stop-color="#060a14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#ff3b30" />
      <stop offset="100%" stop-color="#ff9500" />
    </linearGradient>
    <linearGradient id="swordBlade1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ff7b54" />
      <stop offset="100%" stop-color="#ff1e3c" />
    </linearGradient>
    <linearGradient id="swordBlade2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded shield container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#shieldBorder)" stroke-width="8" opacity="0.85" />
  
  <!-- Outer Carbon Pattern Details -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1b2a4a" stroke-width="4" stroke-dasharray="12, 8" opacity="0.6" />
  
  <!-- Tactical Reticle / Crosshairs -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00e5ff" stroke-width="5" opacity="0.75" filter="url(#glowCyan)" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.5" />
  <circle cx="256" cy="256" r="16" fill="#00e5ff" opacity="0.9" filter="url(#glowCyan)" />

  <!-- Reticle Compass Marks -->
  <line x1="256" y1="96" x2="256" y2="136" stroke="#00e5ff" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="376" x2="256" y2="416" stroke="#00e5ff" stroke-width="6" stroke-linecap="round" />
  <line x1="96" y1="256" x2="136" y2="256" stroke="#00e5ff" stroke-width="6" stroke-linecap="round" />
  <line x1="376" y1="256" x2="416" y2="256" stroke="#00e5ff" stroke-width="6" stroke-linecap="round" />

  <!-- Reticle Corner Brackets -->
  <path d="M 170 170 L 150 170 L 150 190" fill="none" stroke="#ff3b30" stroke-width="5" stroke-linecap="round" />
  <path d="M 342 170 L 362 170 L 362 190" fill="none" stroke="#ff3b30" stroke-width="5" stroke-linecap="round" />
  <path d="M 170 342 L 150 342 L 150 322" fill="none" stroke="#ff3b30" stroke-width="5" stroke-linecap="round" />
  <path d="M 342 342 L 362 342 L 362 322" fill="none" stroke="#ff3b30" stroke-width="5" stroke-linecap="round" />

  <!-- Crossed Combat Blade 1 (Left-top to Right-bottom) -->
  <g filter="url(#glowRed)">
    <!-- Blade -->
    <path d="M 130 110 L 260 240 L 380 360 L 365 375 L 245 255 L 115 125 Z" fill="url(#swordBlade1)" />
    <!-- Guard -->
    <line x1="100" y1="150" x2="150" y2="100" stroke="#ff7b54" stroke-width="12" stroke-linecap="round" />
    <!-- Hilt -->
    <line x1="110" y1="120" x2="70" y2="80" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Crossed Combat Blade 2 (Right-top to Left-bottom) -->
  <g filter="url(#glowCyan)">
    <!-- Blade -->
    <path d="M 382 110 L 252 240 L 132 360 L 147 375 L 267 255 L 397 125 Z" fill="url(#swordBlade2)" />
    <!-- Guard -->
    <line x1="412" y1="150" x2="362" y2="100" stroke="#00e5ff" stroke-width="12" stroke-linecap="round" />
    <!-- Hilt -->
    <line x1="402" y1="120" x2="442" y2="80" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Central Energy Core -->
  <polygon points="256,220 282,256 256,292 230,256" fill="#ffffff" filter="url(#glowCyan)" />
</svg>